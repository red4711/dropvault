name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install cryptography pyyaml requests fastapi pydantic ruamel.yaml

      - name: Syntax + import checks
        run: |
          python -m py_compile vault_handle.py __init__.py tools/register_account.py tools/render_files.py dashboard/plugin_api.py
          python - <<'EOF'
          import ast, pathlib
          for f in ["vault_handle.py", "__init__.py", "tools/register_account.py", "tools/render_files.py", "dashboard/plugin_api.py"]:
              ast.parse(pathlib.Path(f).read_text())
          print("parse OK")
          EOF

      - name: VaultHandle unit checks
        run: |
          python - <<'EOF'
          import importlib.util
          spec = importlib.util.spec_from_file_location("vh", "vault_handle.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          h = m.VaultHandle("default", email="a@b.c")
          assert h.session_env == "BW_SESSION"
          h2 = m.VaultHandle("primary")
          assert h2.session_env == "BW_SESSION_PRIMARY"
          assert str(h.state_dir).endswith("Bitwarden CLI")
          assert str(h2.state_dir).endswith("Bitwarden CLI-primary")
          assert m.valid_vault_id("abc_123")
          assert not m.valid_vault_id("Bad-Id!")
          assert m.scope_for({}) == ("whole", "")
          assert m.scope_for({"folder": " "}) == ("whole", "")
          assert m.scope_for({"folder": "hermes"}) == ("folder", "hermes")
          assert m.scope_for({"folder": "hermes", "collection": "team"}) == ("collection", "team")
          assert m.VaultHandle("x").scope == ("whole", "")
          assert m.VaultHandle("x", folder="hermes").scope == ("folder", "hermes")
          assert m.VaultHandle("x", folder="hermes", collection="team").scope == ("collection", "team")
          e = h2.bw_env("sess")
          assert e["BW_SESSION"] == "sess" and e["BW_SESSION_PRIMARY"] == "sess"
          assert "BW_SESSION" not in h2.bw_env()
          m.VaultHandle("x", server_url="").ensure_server()  # no-op, must not raise
          assert m.VaultHandle.maybe_b64_decode("aGVsbG8=") == "hello"
          assert m.VaultHandle.maybe_b64_decode("not-b64!!") == "not-b64!!"
          print("vault_handle unit checks OK")
          EOF

      - name: JS syntax check
        run: node --check dashboard/dist/index.js

      - name: Crypto unit checks (register_account helpers)
        run: |
          python - <<'EOF'
          import importlib.util, base64, hashlib, hmac
          from pathlib import Path
          spec = importlib.util.spec_from_file_location(
              "reg", "tools/register_account.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)

          pw = b"correct horse battery staple"
          mk = m.master_key(pw, "user@example.com")
          assert len(mk) == 32

          sk = m.stretched(mk)
          assert len(sk) == 64

          # EncString type 2 round-trip: enc(sk[:32], sk[32:], pt) decrypts back
          blob = m.encrypt_with_keys(sk[:32], sk[32:], b"hello world")
          t, rest = blob.split(".", 1)
          assert t == "2"
          iv, ct, mac = (base64.b64decode(x) for x in rest.split("|"))
          assert hmac.new(sk[32:], iv + ct, hashlib.sha256).digest() == mac
          print("crypto round-trips OK")
          EOF

      - name: Dashboard API unit checks (vault roster mgmt)
        # NOTE: fastapi/pydantic/ruamel.yaml come from the Install-deps step
        # above (CI runner has pip). The block uses temp config/env copies —
        # live files are never touched.
        run: |
          python - <<'EOF'
          import importlib.util, shutil
          from pathlib import Path
          spec = importlib.util.spec_from_file_location(
              "dvapi", "dashboard/plugin_api.py")
          m = importlib.util.module_from_spec(spec)
          import sys
          sys.modules["dvapi"] = m
          spec.loader.exec_module(m)

          # pydantic models resolve under the synthetic module name
          for cls in (m.UnlockBody, m.SecretBody, m.VaultBody,
                      m.VaultUpsertBody, m.VaultRemoveBody):
              assert cls.__pydantic_complete__, cls.__name__

          # 2FA helpers
          assert m.TWO_FACTOR_METHODS == {0: "Authenticator", 1: "Email", 3: "YubiKey OTP"}
          assert m.is_two_factor_challenge("Code is required.")
          assert not m.is_two_factor_challenge("Username or password is incorrect")
          argv = m.login_argv("bw", "a@b.c", method=0, code="123")
          assert argv == ["bw", "login", "a@b.c", "--raw", "--passwordenv",
                          "BW_PASSWORD", "--method", "0", "--code", "123"]

          # roster mgmt against temp config/env copies (live files untouched)
          import tempfile
          work = Path(tempfile.mkdtemp())
          (work / "config.yaml").write_text(
              "secrets:\n  dropvault:\n    enabled: true\n    folder: hermes\n"
              "    email: a@b.c\n    ca_cert: /nonexistent-ca.crt\n")
          (work / "env").write_text("")
          m.CONFIG_PATH = work / "config.yaml"
          m.HERMES_ENV = work / "env"

          assert [v["id"] for v in m.list_vaults()["vaults"]] == ["default"]
          out = m.add_vault(m.VaultUpsertBody(id="primary", server_url="https://vault.example.com"))
          assert out == {"ok": True, "id": "primary", "created": True}
          try:
              m.add_vault(m.VaultUpsertBody(id="primary", server_url="https://x.example.com"))
              raise SystemExit("expected 409")
          except Exception as e:
              assert getattr(e, "status_code", None) == 409
          for bad in (dict(id="BAD!", server_url="https://x.example.com"),
                      dict(id="ok2", server_url="ftp://x"),
                      dict(id="ok3")):
              try:
                  m.add_vault(m.VaultUpsertBody(**bad))
                  raise SystemExit(f"expected 422 for {bad}")
              except SystemExit:
                  raise
              except Exception as e:
                  assert getattr(e, "status_code", None) == 422, (bad, e)
          assert [v["id"] for v in m.list_vaults()["vaults"]] == ["default", "primary"]
          m.edit_vault("primary", m.VaultUpsertBody(id="primary", label="P", folder="shared"))
          v = next(v for v in m.list_vaults()["vaults"] if v["id"] == "primary")
          assert v["label"] == "P" and v["folder"] == "shared", v
          m.edit_vault("primary", m.VaultUpsertBody(id="primary", enabled=False))
          v = next(v for v in m.list_vaults()["vaults"] if v["id"] == "primary")
          assert v["enabled"] is False, v  # roster shows disabled vaults
          out = m.remove_vault("primary", m.VaultRemoveBody())
          assert out == {"ok": True, "id": "primary", "removed": True}
          assert [v["id"] for v in m.list_vaults()["vaults"]] == ["default"]
          try:
              m.remove_vault("default", m.VaultRemoveBody())
              raise SystemExit("expected 409")
          except SystemExit:
              raise
          except Exception as e:
              assert getattr(e, "status_code", None) == 409
          print("dashboard API unit checks OK")
          EOF

      - name: Manifest sanity
        run: |
          python - <<'EOF'
          import json, re, pathlib
          m = json.loads(pathlib.Path("dashboard/manifest.json").read_text())
          assert m["name"] == "dropvault"
          assert m["api"] == "plugin_api.py"
          y = pathlib.Path("plugin.yaml").read_text()
          assert "name: dropvault" in y
          print("manifests OK")
          EOF
