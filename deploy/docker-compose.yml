version: "3.8"

# Vaultwarden for Dropvault — loopback-only, TLS via self-signed CA.
# Generate certs first: ./certs/gen-ca.sh

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden-hermes
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:80"     # loopback only — never expose this directly
    environment:
      ROCKET_PORT: 80
      ROCKET_TLS: '{certs="/ssl/server.crt",key="/ssl/server.key"}'
      # Web vault disabled: secrets are managed through the Dropvault tab / bw CLI.
      WEB_VAULT_ENABLED: "false"
      # Admin token: set via .env next to this file (ADMIN_TOKEN=<openssl rand -hex 24>)
      ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}"
    volumes:
      - ./data:/data
      - ./certs/out:/ssl:ro
